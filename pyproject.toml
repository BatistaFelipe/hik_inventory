[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line-too-long — enforced by the formatter, not the linter
    "B008",  # function calls in default arguments (Flask/Path patterns)
]

[tool.ruff.lint.per-file-ignores]
# The scanner deliberately swallows any per-channel/per-device exception
# so one broken DVR does not stop the fleet sweep.
"app/services/scanner.py" = ["BLE001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
typeCheckingMode = "standard"
